name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: npm test
